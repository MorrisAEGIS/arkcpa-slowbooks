<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Employee Portal{% endblock %} — {{ company_name }} — Ark CPA</title>
    <link rel="icon" type="image/png" href="/portal/favicon.ico">
    <style>
        @font-face {
            font-family: "Ark Sans";
            src: url("/static/fonts/Inter-Regular.woff2") format("woff2");
            font-weight: 400;
            font-display: swap;
        }
        @font-face {
            font-family: "Ark Sans";
            src: url("/static/fonts/Inter-SemiBold.woff2") format("woff2");
            font-weight: 600;
            font-display: swap;
        }
        :root {
            color-scheme: dark;
            --bg: #111712;
            --surface: #1a211b;
            --surface-muted: #151b16;
            --border: #3a453b;
            --text: #eef1e9;
            --muted: #abb3a8;
            --gold: #d5ad62;
            --mint: #75c79a;
            --mint-ink: #112119;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Ark Sans", "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            padding: 40px 16px;
        }
        .portal-card {
            background: var(--surface);
            border: 1px solid var(--border);
            box-shadow: 0 22px 64px rgba(0,0,0,0.28);
            width: 100%;
            max-width: 720px;
            height: fit-content;
            border-radius: 8px;
            overflow: hidden;
        }
        .portal-header {
            background: var(--surface-muted);
            color: var(--text);
            padding: 24px;
            border-bottom: 1px solid var(--border);
        }
        .portal-header { display: flex; align-items: center; gap: 16px; }
        .portal-header .portal-brand { flex: 1; }
        .portal-header h1 { font-size: 20px; margin-bottom: 4px; }
        .portal-header .subtitle { font-size: 13px; opacity: 0.85; }
        .portal-header .company-logo {
            max-height: 56px; max-width: 140px; background: #f8f5ed;
            padding: 6px 10px; border-radius: 4px;
        }
        .portal-nav {
            display: flex;
            flex-wrap: wrap;
            background: var(--surface-muted);
            border-bottom: 1px solid var(--border);
        }
        .portal-nav a {
            padding: 12px 16px;
            font-size: 13px;
            font-weight: 600;
            color: var(--muted);
            text-decoration: none;
            border-bottom: 3px solid transparent;
        }
        .portal-nav a:hover { background: var(--surface); color: var(--text); }
        .portal-nav a.active {
            color: var(--text);
            border-bottom-color: var(--gold);
            background: var(--surface);
        }
        .portal-logout {
            min-height: 44px;
            padding: 12px 16px;
            border: 0;
            background: transparent;
            color: var(--muted);
            font: 600 13px/1 "Ark Sans", sans-serif;
            cursor: pointer;
        }
        .portal-logout:hover { color: var(--text); background: var(--surface); }
        .portal-body { padding: 24px; }
        h2 { font-size: 17px; color: var(--text); margin-bottom: 14px; }
        h3 { font-size: 14px; color: var(--text); margin: 20px 0 10px; }
        p { font-size: 14px; line-height: 1.5; }
        .data-table { width: 100%; border-collapse: collapse; margin-bottom: 16px; }
        .data-table th, .data-table td {
            padding: 9px 10px;
            font-size: 13px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        .data-table th {
            color: var(--muted);
            font-weight: 700;
            background: var(--surface-muted);
        }
        .data-table td.num, .data-table th.num { text-align: right; }
        .summary-table { width: 100%; border-collapse: collapse; margin-bottom: 16px; }
        .summary-table td {
            padding: 8px 0;
            font-size: 14px;
            border-bottom: 1px solid var(--border);
        }
        .summary-table td:first-child {
            color: var(--muted);
            font-weight: 600;
            width: 42%;
        }
        .banner {
            padding: 12px 14px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 16px;
        }
        .banner-success { background: #d1fae5; color: #065f46; border: 1px solid #6ee7b7; }
        .banner-error { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
        form.portal-form { margin-top: 8px; }
        .field { margin-bottom: 14px; }
        .field label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--muted);
            margin-bottom: 4px;
        }
        .field input[type=text],
        .field input[type=number],
        .field input[type=date],
        .field select,
        .field textarea {
            width: 100%;
            padding: 8px 10px;
            font-size: 14px;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: var(--surface-muted);
            color: var(--text);
        }
        .field textarea { min-height: 70px; resize: vertical; }
        .field.checkbox label { display: flex; align-items: center; gap: 8px; }
        .field.checkbox input { width: auto; }
        .field-row { display: flex; gap: 12px; }
        .field-row .field { flex: 1; }
        .btn {
            display: inline-block;
            padding: 11px 20px;
            background: var(--mint);
            color: var(--mint-ink);
            border: 1px solid var(--mint);
            border-radius: 4px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
        }
        .btn:hover { filter: brightness(0.94); }
        .btn:focus-visible, .portal-nav a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
            outline: 2px solid var(--gold); outline-offset: 3px;
        }
        .pill {
            display: inline-block;
            padding: 2px 9px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 700;
            text-transform: capitalize;
        }
        .pill-pending { background: #fef3c7; color: #92400e; }
        .pill-approved { background: #d1fae5; color: #065f46; }
        .pill-denied { background: #fee2e2; color: #991b1b; }
        .pill-active { background: #dbeafe; color: #1e40af; }
        .pill-inactive { background: #e4e8ee; color: #4a4a6a; }
        .muted { color: var(--muted); font-size: 13px; }
        .portal-footer {
            padding: 12px 24px;
            text-align: center;
            font-size: 11px;
            color: var(--muted);
            border-top: 1px solid var(--border);
        }
        a.link { color: var(--mint); font-weight: 600; }
        @media (prefers-color-scheme: light) {
            :root {
                color-scheme: light;
                --bg: #eee9dd;
                --surface: #fbf9f3;
                --surface-muted: #f4f0e6;
                --border: #d0c8b8;
                --text: #263027;
                --muted: #59645a;
                --gold: #9b6f27;
                --mint: #4f9d72;
                --mint-ink: #f8fff9;
            }
        }
        @media (max-width: 600px) {
            body { padding: 16px 10px; }
            .portal-header, .portal-body { padding: 20px 18px; }
            .field-row { flex-direction: column; gap: 0; }
            .portal-nav a, .portal-nav button { min-height: 44px; }
            .data-table { display: block; overflow-x: auto; }
        }
    </style>
</head>
<body>
    <div class="portal-card">
        <div class="portal-header">
            <div class="portal-brand">
                <h1>{{ company_name }}</h1>
                <div class="subtitle">Employee Portal &middot; {{ emp.full_name }}</div>
            </div>
            {% if company_logo_url %}
            <img class="company-logo" src="{{ company_logo_url }}" alt="{{ company_name }} logo">
            {% endif %}
        </div>
        <nav class="portal-nav">
            <a href="/portal/"{% if active == 'dashboard' %} class="active"{% endif %}>Dashboard</a>
            <a href="/portal/paystubs"{% if active == 'paystubs' %} class="active"{% endif %}>Pay Stubs</a>
            <a href="/portal/profile"{% if active == 'profile' %} class="active"{% endif %}>Profile</a>
            <a href="/portal/bank"{% if active == 'bank' %} class="active"{% endif %}>Bank</a>
            <a href="/portal/pto"{% if active == 'pto' %} class="active"{% endif %}>Time Off</a>
            <form method="post" action="/portal/logout" style="margin-left:auto;display:inline">
                <button class="portal-logout" type="submit">Sign out</button>
            </form>
        </nav>
        <div class="portal-body">
            {% block content %}{% endblock %}
        </div>
        <div class="portal-footer">Private employee access by Ark CPA</div>
    </div>
</body>
</html>
